services:
  - type: web
    name: oneportal-free
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render-free
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ConnectionStrings__MigrationConnection
        sync: false
      - key: Jwt__PrivateKeyPem
        sync: false
      - key: Jwt__PublicKeyPem
        sync: false
      - key: Jwt__Issuer
        value: OnePortal
      - key: Jwt__Audience
        value: OnePortal
      - key: Quoting__Storage__AllowLocalFallback
        value: false
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Supabase__Bucket
        value: quotations
      - key: Quoting__Images__Bucket
        value: product-images
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cors__AllowedOrigins__1
        sync: false
      - key: Cors__AllowedOrigins__2
        sync: false
